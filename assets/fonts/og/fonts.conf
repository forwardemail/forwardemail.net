<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts of the Open Graph images (helpers/open-graph-image.js).

  The images are rendered server-side by sharp (librsvg and pango), which
  finds fonts through fontconfig and reads TrueType/OpenType files only, so
  the fonts the website serves as WOFF are kept here as TTF: Nunito Sans
  Regular and Bold (the complete font from Google Fonts, SIL Open Font
  License, covering Latin, Cyrillic, Greek and Vietnamese) and, from the
  parent directory, Inconsolata-dz.  The system's own configuration is
  included so that scripts these fonts do not cover (CJK, Arabic, Hebrew,
  Thai...) still fall back to whatever the host provides.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">..</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
