---
name: Release convert-sqlite-to-eml Binaries

on:
  release:
    types: [published]

# Default to no permissions
permissions: {}

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    # This job installs dependencies and runs their code, so it can only read
    # the repository. The job below attaches what it built to the release.
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: convert-sqlite-to-eml-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: convert-sqlite-to-eml-linux-arm64
          - os: macos-14
            target: darwin-arm64
            artifact: convert-sqlite-to-eml-darwin-arm64
          - os: windows-latest
            target: win-x64
            artifact: convert-sqlite-to-eml-win-x64

    defaults:
      run:
        working-directory: tools/convert-sqlite-to-eml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # (the versions in package-lock.json, which Dependabot keeps current)
      - name: Install dependencies
        run: npm ci

      - name: Run converter tests
        run: npm test

      - name: Build SEA binary
        run: npm run build

      - name: Rename binary for release (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/convert-sqlite-to-eml dist/${{ matrix.artifact }}

      - name: Rename binary for release (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item dist/convert-sqlite-to-eml.exe dist/${{ matrix.artifact }}.exe
        shell: pwsh

      - name: Test SEA binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Testing SEA binary..."
          ./dist/${{ matrix.artifact }} --help
        shell: bash

      - name: Test SEA binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Testing SEA binary..."
          & ".\dist\${{ matrix.artifact }}.exe" --help
        shell: pwsh

      - name: Hand the binary to the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: tools/convert-sqlite-to-eml/dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  upload-binaries:
    needs: build-binaries
    # (as before, the binaries that were built are attached when the build
    # for another system failed)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Collect the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
