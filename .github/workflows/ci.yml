---
name: CI
on:
  - push
  - pull_request

# Default to no permissions; each job declares only what it needs
permissions: {}

# Cancel in-progress runs for the same branch/PR to save resources
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Pre-merge secret scan. Catches accidentally-committed tokens, signing
  # keys, etc. before they hit main. Uses the gitleaks CLI directly (MIT-
  # licensed, no license key needed) instead of gitleaks-action, which
  # requires a paid GITLEAKS_LICENSE for organization-owned repositories.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # What was pushed, and nothing else: with no --log-opts gitleaks
          # reads `git log --all`, every branch of the repository, so a
          # release's tag failed for a test fixture on a branch that was
          # never merged.
          if [ -n "$PR_BASE" ]; then
            # a pull request: its own commits
            SINCE="$PR_BASE"
          else
            # a push: every commit since the release before it (from HEAD^,
            # as a release's own tag is on HEAD). Not since
            # `github.event.before`: that commit is gone after a force-push,
            # it is all zeros for a new branch or tag, and a run cancelled by
            # the next push (see `concurrency`) left its commits unscanned.
            SINCE="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          fi

          # (no release before it: all of its history)
          gitleaks detect --source . --verbose --log-opts="--full-history ${SINCE:+$SINCE..}HEAD"
