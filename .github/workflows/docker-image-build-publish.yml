---
name: Build and Publish Self-Hosted Docker Image
on:
  # push:
  #   tags:
  #     - 'v*'  # Trigger the workflow on tags starting with 'v', for example v1.0.0
  release:
    types: [published]  # Trigger the workflow on new releases

# Restrict permissions to the minimum required
permissions:
  contents: read
  packages: write

jobs:
  # Build each architecture natively (QEMU emulation is far too slow for the
  # native module compiles: better-sqlite3-multiple-ciphers, re2, node-libcurl)
  build:
    runs-on: ${{ matrix.runner }}
    continue-on-error: false
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      AUTH_GITHUB_ENABLED: "false"
      AUTH_GOOGLE_ENABLED: "false"
      I18N_SYNC_FILES: "true"
      I18N_UPDATE_FILES: "true"
      PREVIEW_EMAIL: "false"
      TRUTH_SOURCES: "truthsource.com"
      TURNSTILE_ENABLED: "false"
      WEB_HOST: "example.com"
      SMTP_MESSAGE_MAX_SIZE: ${{ secrets.SMTP_MESSAGE_MAX_SIZE }}
      DKIM_PRIVATE_KEY_VALUE: ${{ secrets.DKIM_PRIVATE_KEY_VALUE }}
      AXE_SILENT: ${{ secrets.AXE_SILENT }}
      AXE_SHOW_META: ${{ secrets.AXE_SHOW_META }}
      AXE_SHOW_STACK: ${{ secrets.AXE_SHOW_STACK }}
      TXT_ENCRYPTION_KEY: ${{ secrets.TXT_ENCRYPTION_KEY }}
      HELPER_ENCRYPTION_KEY: ${{ secrets.HELPER_ENCRYPTION_KEY }}
      SRS_SECRET: ${{ secrets.SRS_SECRET }}
    steps:
      # Checkout the repository to the runner
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Log into GitHub Container Registry using a GitHub token
      - name: Log into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Remove parts of the schema not related to self hosted that will fail the build
      - name: Update Schema for Self Hosted
        run: |
          sed -i -E \
          -e '/^APPLE/d' \
          -e '/^MICROSOFT/d' \
          -e '/^TWILIO/d' \
          -e '/^PAYPAL/d' \
          -e '/^STRIPE/d' \
          -e '/^SRS_SECRET/d' \
          ".env.schema"

      # Build and push a per-architecture image tag; the merge job below
      # combines them into one multi-arch manifest
      - name: Build / Publish per-arch Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-selfhosted
          TAG=${{ github.ref_name }}
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f self-hosting/Dockerfile-selfhosted \
            -t "$IMAGE:$TAG-${{ matrix.arch }}" \
            --cache-from "type=registry,ref=$IMAGE:buildcache-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=$IMAGE:buildcache-${{ matrix.arch }},mode=max" \
            --push \
            .
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

  # Combine the per-arch images into multi-arch manifests for the release
  # tag and latest
  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-selfhosted
          TAG=${{ github.ref_name }}
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
