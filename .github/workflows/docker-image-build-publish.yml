---
name: Build and Publish Self-Hosted Docker Image
on:
  # push:
  #   tags:
  #     - 'v*'  # Trigger the workflow on tags starting with 'v', for example v1.0.0
  release:
    types: [published]  # Trigger the workflow on new releases
  # a manual run publishes an image tagged with the branch's name (e.g.
  # `master`, for testing before a release) and leaves `latest` alone
  workflow_dispatch:

# Restrict permissions to the minimum required
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    timeout-minutes: 30
    # each architecture builds on a native runner (native modules such as
    # better-sqlite3-multiple-ciphers and re2 compile far too slowly under
    # QEMU), and the `merge` job joins them into one multi-arch tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    env:
      AUTH_GITHUB_ENABLED: "false"
      AUTH_GOOGLE_ENABLED: "false"
      I18N_SYNC_FILES: "false"
      I18N_UPDATE_FILES: "false"
      PREVIEW_EMAIL: "false"
      TRUTH_SOURCES: "truthsource.com"
      TURNSTILE_ENABLED: "false"
      WEB_HOST: "example.com"
    steps:
      # Checkout the repository to the runner
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Log into GitHub Container Registry using a GitHub token
      - name: Log into GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Remove parts of the schema not related to self hosted that will fail the build
      - name: Update Schema for Self Hosted
        run: |
          sed -i -E \
          -e '/^APPLE/d' \
          -e '/^MICROSOFT/d' \
          -e '/^TWILIO/d' \
          -e '/^PAYPAL/d' \
          -e '/^STRIPE/d' \
          -e '/^SRS_SECRET/d' \
          ".env.schema"

      # Build / Publish the Docker image to GitHub Container Registry
      - name: Build / Publish Docker image to GitHub Container Registry
        run: |
          # (the name of the release's tag is read from the environment: text
          # interpolated into this script would run as part of it)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-selfhosted"
          # (a branch's name may have slashes, which a tag may not)
          TAG="${GITHUB_REF_NAME//\//-}"

          # an architecture-specific tag, which the `merge` job below joins
          # with the others into the versioned and `latest` tags
          docker buildx build \
            --platform "linux/${ARCH}" \
            -f self-hosting/Dockerfile-selfhosted \
            -t "${IMAGE}:${TAG}-${ARCH}" \
            --provenance=false \
            --push \
            .
        env:
          ARCH: ${{ matrix.arch }}

  # joins the images of every architecture into one multi-arch manifest, so
  # that `docker pull` picks the right one on x86, Apple Silicon and Raspberry Pi
  # (it only runs when every architecture built, so `latest` is never left
  # pointing at an image without arm64 or amd64)
  merge:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-selfhosted"
          TAG="${GITHUB_REF_NAME//\//-}"
          # only a release moves `latest`
          LATEST=()
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            LATEST=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${LATEST[@]}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
