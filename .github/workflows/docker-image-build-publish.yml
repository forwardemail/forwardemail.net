---
name: Build and Publish Self-Hosted Docker Image
on:
  # push:
  #   tags:
  #     - 'v*'  # Trigger the workflow on tags starting with 'v', for example v1.0.0
  release:
    types: [published]  # Trigger the workflow on new releases

# Restrict permissions to the minimum required
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node_version:
          - "18.20.4"
    env:
      AUTH_GITHUB_ENABLED: "false"
      AUTH_GOOGLE_ENABLED: "false"
      I18N_SYNC_FILES: "false"
      I18N_UPDATE_FILES: "false"
      PREVIEW_EMAIL: "false"
      TRUTH_SOURCES: "truthsource.com"
      TURNSTILE_ENABLED: "false"
      WEB_HOST: "example.com"
    steps:
      # Checkout the repository to the runner
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Log into GitHub Container Registry using a GitHub token
      - name: Log into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Remove parts of the schema not related to self hosted that will fail the build
      - name: Update Schema for Self Hosted
        run: |
          sed -i -E \
          -e '/^APPLE/d' \
          -e '/^MICROSOFT/d' \
          -e '/^TWILIO/d' \
          -e '/^PAYPAL/d' \
          -e '/^STRIPE/d' \
          -e '/^SRS_SECRET/d' \
          ".env.schema"

      # Build / Publish the Docker image to GitHub Container Registry
      - name: Build / Publish Docker image to GitHub Container Registry
        run: |
          # (the name of the release's tag is read from the environment: text
          # interpolated into this script would run as part of it)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-selfhosted"
          IMAGE_NAME="${IMAGE}:${GITHUB_REF_NAME}"
          docker build -f self-hosting/Dockerfile-selfhosted -t "$IMAGE_NAME" .

          # Tag the image as 'latest' to update the latest tag
          docker tag "$IMAGE_NAME" "${IMAGE}:latest"

          # Push both the versioned and latest tags to GitHub Container Registry
          docker push "$IMAGE_NAME"
          docker push "${IMAGE}:latest"
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
