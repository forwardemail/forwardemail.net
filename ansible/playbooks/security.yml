    - name: Create fleet-wide systemd failure-notification drop-in directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/systemd/system/service.d
        - /etc/systemd/system/failure-notification@.service.d
        - /etc/systemd/system/forwardemail-systemd-incident-event@.service.d
        - /etc/systemd/system/forwardemail-systemd-incident-reconcile.service.d

    - name: Hook every systemd service failure into centralized notifications
      ansible.builtin.copy:
        dest: /etc/systemd/system/service.d/10-forwardemail-failure-notification.conf
        content: |
          # WARNING: This file is managed by Ansible
          [Unit]
          OnFailure=failure-notification@%n.service
        owner: root
        group: root
        mode: '0644'

    - name: Prevent recursive failure notifications from alert services
      ansible.builtin.copy:
        dest: "{{ item }}/99-no-recursion.conf"
        content: |
          # WARNING: This file is managed by Ansible
          [Unit]
          OnFailure=
        owner: root
        group: root
        mode: '0644'
      loop:
        - /etc/systemd/system/failure-notification@.service.d
        - /etc/systemd/system/forwardemail-systemd-incident-event@.service.d
        - /etc/systemd/system/forwardemail-systemd-incident-reconcile.service.d
      tags:
        - forwardemail-systemd-incident

    - name: Reload systemd daemon for fleet-wide failure notifications
      ansible.builtin.systemd:
        daemon_reload: true
      tags:
        - forwardemail-systemd-incident

    - name: Enable systemd incident reconciliation timer
      ansible.builtin.systemd:
        name: forwardemail-systemd-incident-reconcile.timer
        enabled: true
        state: started
      when: forwardemail_systemd_incident_enabled | bool
      tags:
        - forwardemail-systemd-incident

    - name: Disable systemd incident reconciliation timer when unconfigured
      ansible.builtin.systemd:
        name: forwardemail-systemd-incident-reconcile.timer
        enabled: false
        state: stopped
      when: not (forwardemail_systemd_incident_enabled | bool)
      failed_when: false
      tags:
        - forwardemail-systemd-incident

