---
- name: Import Unbound DNS caching playbook
  import_playbook: unbound.yml
  vars:
    target_hosts: "{{ security_target_hosts | default('all') }}"

- name: Import System Optimization playbook
  import_playbook: system-optimization.yml
  vars:
    target_hosts: "{{ security_target_hosts | default('all') }}"

- name: Import AMD Ryzen NUMA Optimization playbook
  import_playbook: amd-ryzen-numa.yml
  vars:
    target_hosts: "{{ security_target_hosts | default('all') }}"
    service_name: "System"
    disable_thp: false

- name: Import Chrony time synchronization playbook
  import_playbook: chrony-timesync.yml
  vars:
    target_hosts: "{{ security_target_hosts | default('all') }}"

- hosts: "{{ security_target_hosts | default('all') }}"
  name: Security
  become: true
  become_user: root
  vars:
    copy_local_key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa.pub') }}"
    copy_local_key_2: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa_2.pub') }}"
    alert_email_sender: "{{ lookup('env', 'ALERT_EMAIL_FROM') | default('mailerdaemon@forwardemail.net', true) }}"
    alert_email_recipients: "{{ lookup('env', 'ALERT_EMAIL_RECIPIENTS') | default(lookup('env', 'MSMTP_RCPTS') | default('security@forwardemail.net', true), true) }}"
    twilio_account_sid: "{{ lookup('env', 'TWILIO_ACCOUNT_SID') }}"
    twilio_auth_token: "{{ lookup('env', 'TWILIO_AUTH_TOKEN') }}"
    twilio_from_number: "{{ lookup('env', 'TWILIO_FROM_NUMBER') }}"
    twilio_to_number: "{{ lookup('env', 'TWILIO_TO_NUMBER') }}"
    github_octokit_token: "{{ lookup('env', 'GITHUB_OCTOKIT_TOKEN') }}"
    systemd_incident_failure_threshold: >-
      {{ lookup('env', 'SYSTEMD_INCIDENT_FAILURE_THRESHOLD') | default('3', true) | int }}
    systemd_incident_recovery_threshold: >-
      {{ lookup('env', 'SYSTEMD_INCIDENT_RECOVERY_THRESHOLD') | default('3', true) | int }}
    systemd_incident_observation_interval_seconds: 60
    systemd_incident_api_url: "https://api.github.com"
    systemd_incident_host_map:
      mongo.forwardemail.net:
        component: mongo.forwardemail.net
        unit: mongod.service
      logs.forwardemail.net:
        component: logs.forwardemail.net
        unit: mongod.service
      redis.forwardemail.net:
        component: redis.forwardemail.net
        unit: valkey-server.service
  pre_tasks:
    # Freeze these values once per inventory host.  Keeping them as generic,
    # lazily evaluated play variables allowed separate MongoDB and Valkey runs
    # to cross-resolve each other's HELO identity while retaining the correct
    # host IP.  Every Postfix and SPF task below must consume these facts.
    - name: Freeze direct-alert identity for this host
      ansible.builtin.set_fact:
        forwardemail_direct_alert_public_ip: >-
          {{
            hostvars[inventory_hostname]['direct_alert_public_ip']
            | default(ansible_host | default(ansible_default_ipv4.address), true)
          }}
        forwardemail_direct_alert_helo_identity: >-
          {{
            hostvars[inventory_hostname]['direct_alert_helo_identity']
            | default(ansible_fqdn, true)
            | lower
            | regex_replace('\\.$', '')
          }}
      tags:
        - always
        - forwardemail-alert-identity

    - name: Bind public systemd incident reporting to this host identity
      ansible.builtin.set_fact:
        forwardemail_systemd_incident_config: >-
          {{
            systemd_incident_host_map[
              forwardemail_direct_alert_helo_identity
            ]
            | default({})
          }}
      tags:
        - always
        - forwardemail-systemd-incident

    - name: Derive public systemd incident reporter state
      ansible.builtin.set_fact:
        forwardemail_systemd_incident_component: >-
          {{ forwardemail_systemd_incident_config.component | default('') }}
        forwardemail_systemd_incident_unit: >-
          {{ forwardemail_systemd_incident_config.unit | default('') }}
        forwardemail_systemd_incident_enabled: >-
          {{
            (forwardemail_systemd_incident_config | length > 0) and
            (github_octokit_token | length > 0)
          }}
      no_log: true
      tags:
        - always
        - forwardemail-systemd-incident

    # A host-specific override must never let one server advertise another
    # server's identity (for example, mongo.forwardemail.net on Redis).
    - name: Verify direct-alert HELO identity belongs to this host
      ansible.builtin.assert:
        that:
          - (ansible_fqdn | default('', true) | length) > 0
          - >-
            (forwardemail_direct_alert_helo_identity | default('', true) |
            lower | regex_replace('\\.$', '')) ==
            (ansible_fqdn | default('', true) | lower |
            regex_replace('\\.$', ''))
        fail_msg: >-
          Refusing to configure direct alerts on {{ inventory_hostname }}:
          direct_alert_helo_identity resolved to
          {{ forwardemail_direct_alert_helo_identity | default('UNSET', true) }},
          but gathered
          ansible_fqdn is {{ ansible_fqdn | default('UNAVAILABLE', true) }}.
          Correct or remove this host's direct_alert_helo_identity override;
          never reuse another host's HELO identity.
      tags:
        - always
        - forwardemail-alert-identity

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

    - name: Reload auditd rules
      command: augenrules --load
      changed_when: false
    - name: Restart rsyslog
      service:
        name: rsyslog
        state: restarted

    - name: Restart Postfix
      service:
        name: postfix
        state: restarted

    - name: Restart monitoring services
      systemd:
        daemon_reload: yes
        name: "{{ item }}"
        state: restarted
      loop:
        - system-resource-monitor.timer
        - ssh-security-monitor.timer
        - usb-device-monitor.timer
        - root-access-monitor.timer
        - lynis-audit-monitor.timer
        - package-monitor.timer
        - open-ports-monitor.timer
        - ssl-certificate-monitor.timer
  tasks:
    # Ensure netplan is installed and protected from removal
    - name: Ensure netplan is installed
      apt:
        name: netplan.io
        state: present
        update_cache: no

    - name: Hold netplan package to prevent removal
      dpkg_selections:
        name: netplan.io
        selection: hold

    - name: Delete Digital Ocean Networking Configuration
      ansible.builtin.file:
        state: absent
        path: /etc/systemd/resolved.conf.d/DigitalOcean.conf

    - name: Remove Ubuntu Advantage Tools
      apt:
        pkg: ubuntu-advantage-tools
        state: absent

    - name: Purge Ubuntu Advantage Tools
      apt:
        autoremove: yes
        purge: true
        name:
          - ubuntu-advantage-tools

    - name: Insert/Update disable core dumps
      blockinfile:
        path: /etc/security/limits.conf
        state: present
        block: |
          * hard core 0
          * soft core 0

    # https://www.mongodb.com/docs/manual/tutorial/transparent-huge-pages/
    # https://unix.stackexchange.com/questions/99154/disable-transparent-hugepages
    # https://stackoverflow.com/questions/51246128/disabling-thp-transparent-hugepages-with-ansible-role
    - name: "Disable Transparent Huge Pages (THP)"
      template:
        src: "{{ playbook_dir }}/templates/thp.j2"
        dest: /etc/systemd/system/disable-transparent-huge-pages.service
        owner: root
        mode: "0644"

    - name: "Enable Disabled THP Systemd Service"
      service:
        daemon_reload: yes
        name: disable-transparent-huge-pages
        enabled: true
        state: started

    - name: Ensure fs.suid_dumpable is set to 0 and added in sysctl
      ansible.posix.sysctl:
        name: fs.suid_dumpable
        value: "0"
        sysctl_set: true

    - name: Insert/Update disable core dumps
      blockinfile:
        path: /etc/profile
        state: present
        block: |
          ulimit -S -c 0 > /dev/null 2>&1

    # Disable swap entirely on hosts that do not manage emergency swap.
    # MongoDB, Redis, and logs hosts retain swap as a last resort with low
    # swappiness configured by their service playbooks.
    # https://unix.stackexchange.com/a/636526
    - name: Disable swap for current session
      command: swapoff -a
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length == 0
    - name: Disable swap permanently, persist reboots
      replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
        replace: '#\1\2\3swap\4'
        backup: yes
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length == 0
    - name: Disable swap on boot via systemd
      template:
        src: "{{ playbook_dir }}/templates/noswap.j2"
        dest: /etc/systemd/system/noswap.service
        owner: root
        mode: "0644"
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length == 0
    - name: Enable noswap service via systemd
      systemd:
        daemon_reload: yes
        name: noswap
        enabled: true
        state: started
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length == 0

    - name: Inspect stale noswap service on swap-enabled hosts
      stat:
        path: /etc/systemd/system/noswap.service
        follow: false
      register: stale_noswap_service
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length > 0

    - name: Disable stale noswap service on swap-enabled hosts
      systemd:
        daemon_reload: yes
        name: noswap
        enabled: false
        state: stopped
      when:
        - group_names | intersect(['mongo', 'redis', 'logs']) | length > 0
        - stale_noswap_service.stat.exists | default(false)

    - name: Remove stale noswap service on swap-enabled hosts
      file:
        path: /etc/systemd/system/noswap.service
        state: absent
      when: group_names | intersect(['mongo', 'redis', 'logs']) | length > 0

    # Disable Modprobe Loading of USB Storage Driver
    # https://docs.datadoghq.com/security/default_rules/xccdf-org-ssgproject-content-rule-kernel-module-usb-storage-disabled/
    - name: Ensure kernel module 'usb-storage' is disabled
      lineinfile:
        create: true
        dest: /etc/modprobe.d/usb-storage.conf
        regexp: install\s+usb-storage
        line: install usb-storage /bin/true

    - name: Update initramfs
      shell: update-initramfs -u
      register: initramfs_result
      retries: 3
      delay: 5
      until: initramfs_result.rc == 0
      changed_when: initramfs_result.rc == 0

    # TODO: Disable Accepting ICMP Redirects for All IPv4 Interfaces
    #       https://docs.datadoghq.com/security/default_rules/xccdf-org-ssgproject-content-rule-sysctl-net-ipv4-conf-all-accept-redirects/#ansible-playbook

    # Disable Apport Service
    # https://docs.datadoghq.com/security/default_rules/xccdf-org-ssgproject-content-rule-service-apport-disabled/#ansible-playbook
    - name: Check if apport service exists
      stat:
        path: /lib/systemd/system/apport.service
      register: apport_service

    - name: Disable service apport
      systemd:
        name: apport.service
        enabled: 'no'
        state: stopped
        masked: 'yes'
      when: apport_service.stat.exists
      register: apport_disable
      failed_when: false
    # NOTE: this does not seem necessary since apport.socket does not exist
    #- name: Disable socket apport
    #  systemd:
    #    name: apport.socket
    #    enabled: 'no'
    #    state: stopped
    #    masked: 'yes'
    - name: Disable apport via config
      block:
        - name: Deduplicate values from /etc/default/apport
          lineinfile:
            path: /etc/default/apport
            create: false
            line: enabled=1
            state: absent
        - name: Insert correct line to /etc/default/apport
          lineinfile:
            path: /etc/default/apport
            create: false
            line: enabled=0
            state: present

    #
    # Disable coredump backtraces
    # https://docs.datadoghq.com/security/default_rules/xccdf-org-ssgproject-content-rule-coredump-disable-backtraces/
    #
    - name: Disable core dump backtraces
      block:
        - name: Check for duplicate values
          lineinfile:
            path: /etc/systemd/coredump.conf
            create: true
            regexp: ^\s\*ProcessSizeMax\s\*=\s\*
            state: absent
          check_mode: true
          changed_when: false
          register: dupes
        - name: Deduplicate values from /etc/systemd/coredump.conf
          lineinfile:
            path: /etc/systemd/coredump.conf
            create: true
            regexp: ^\s\*ProcessSizeMax\s\*=\s\*
            state: absent
          when: dupes.found is defined and dupes.found > 1
        - name: Insert correct line to /etc/systemd/coredump.conf
          lineinfile:
            path: /etc/systemd/coredump.conf
            create: true
            regexp: ^\s\*ProcessSizeMax\s\*=\s\*
            line: ProcessSizeMax=0
            state: present

    # update deps
    - name: Update apt
      apt:
        update_cache: true

    # upgrade deps
    - name: Upgrade deps
      apt:
        upgrade: safe
        update_cache: true

    # Preseed Postfix as local-only during package installation.  Ansible
    # installs the final send-only direct-MX configuration before restarting it.
    - name: Preseed Postfix mailer type
      debconf:
        name: postfix
        question: postfix/main_mailer_type
        value: Local only
        vtype: select

    - name: Preseed Postfix system mail name
      debconf:
        name: postfix
        question: postfix/mailname
        value: "{{ ansible_fqdn }}"
        vtype: string

    # install deps
    - name: Install deps
      apt:
        name:
          - iptables
          - ipset
          - build-essential
          - curl
          - ufw
          - git
          - vim
          - wget
          - libtool
          - automake
          - autoconf
          - nasm
          - ripgrep
          - redis-tools
          - postfix
          - spf-tools-perl
          - tpm2-tools
          - libtss2-dev
        update_cache: true

    # Verify TPM 2.0 availability (optional — cloud/VPS hosts may not have TPM hardware)
    - name: Check if TPM device exists
      stat:
        path: /sys/class/tpm/tpm0/tpm_version_major
      register: tpm_device

    - name: Verify TPM 2.0 is available
      command: cat /sys/class/tpm/tpm0/tpm_version_major
      register: tpm_version
      changed_when: false
      failed_when: tpm_version.stdout != '2'
      when: tpm_device.stat.exists

    - name: Warn if TPM is not available
      debug:
        msg: "WARNING: TPM 2.0 is not available on this host. Hardware-backed security features will not be available. This is expected on cloud/VPS hosts."
      when: not tpm_device.stat.exists

    # prevents port scanning
    # https://github.com/forwardemail/portscan-protection
    # (we maintain our own fork since it has an auto-update in place)
    # https://unix.stackexchange.com/a/580520
    # Deploy from local file to avoid GitHub rate limiting
    - name: Copy portscan protection script to server
      copy:
        src: "{{ playbook_dir }}/files/portscan-protection.sh"
        dest: /tmp/portscan-protection.sh
        mode: '0755'

    - name: Run portscan protection script
      shell: bash /tmp/portscan-protection.sh -i
      register: port_scan
      failed_when: port_scan.rc != 1

    - name: Remove temporary portscan script
      file:
        path: /tmp/portscan-protection.sh
        state: absent

    # Infrastructure alerts must not depend on the production SMTP service,
    # application queue, or MongoDB.  Postfix keeps a small local retry queue
    # and delivers directly to each recipient domain's MX over outbound port 25.
    - name: Configure send-only direct-to-MX Postfix
      template:
        src: "{{ playbook_dir }}/templates/postfix-alerts-main.cf.j2"
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Postfix

    - name: Remove legacy production SMTP relay packages
      apt:
        name:
          - msmtp
          - msmtp-mta
        state: absent
        purge: true

    - name: Remove legacy production SMTP relay credentials and logs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/msmtprc
        - /var/log/msmtp.log

    - name: Verify Postfix owns the local sendmail submission binary
      command: dpkg-query -S /usr/sbin/sendmail
      register: postfix_sendmail_owner
      changed_when: false
      failed_when: >-
        postfix_sendmail_owner.rc != 0 or
        'postfix: /usr/sbin/sendmail' not in postfix_sendmail_owner.stdout_lines

    - name: Enable send-only Postfix
      systemd:
        name: postfix
        enabled: true
        state: started

    - name: Apply direct-to-MX Postfix configuration before validation
      meta: flush_handlers

    - name: Validate Postfix configuration
      command: postfix check
      changed_when: false

    - name: Verify hardened send-only Postfix runtime configuration
      shell: |
        set -eu

        assert_postconf() {
          parameter="$1"
          expected="$2"
          actual="$(postconf -h "$parameter")"
          if [ "$actual" != "$expected" ]; then
            printf '%s: expected <%s>, got <%s>\n' \
              "$parameter" "$expected" "$actual" >&2
            exit 1
          fi
        }

        assert_postconf master_service_disable 'inet'
        assert_postconf inet_interfaces 'loopback-only'
        assert_postconf inet_protocols 'ipv4'
        assert_postconf authorized_submit_users 'root'
        assert_postconf relayhost ''
        assert_postconf relay_domains ''
        assert_postconf mynetworks ''
        assert_postconf mydestination ''
        assert_postconf default_transport 'smtp'
        assert_postconf local_transport \
          'error:local mailbox delivery is disabled'
        assert_postconf virtual_transport \
          'error:virtual mailbox delivery is disabled'
        assert_postconf relay_transport \
          'error:relay-domain delivery is disabled'
        assert_postconf local_recipient_maps ''
        assert_postconf alias_maps ''
        assert_postconf alias_database ''
        assert_postconf virtual_alias_maps ''
        assert_postconf virtual_mailbox_maps ''
        assert_postconf myhostname '{{ forwardemail_direct_alert_helo_identity }}'
        assert_postconf smtp_helo_name '$myhostname'
        assert_postconf smtp_address_preference 'ipv4'
        assert_postconf smtp_tls_security_level 'may'
        assert_postconf smtp_tls_CAfile \
          '/etc/ssl/certs/ca-certificates.crt'
        assert_postconf smtpd_relay_restrictions \
          'reject_unauth_destination'
        assert_postconf smtpd_recipient_restrictions \
          'reject_unauth_destination'
        assert_postconf sender_canonical_maps \
          'static:{{ alert_email_sender }}'
        assert_postconf sender_canonical_classes \
          'envelope_sender, header_sender'
      args:
        executable: /bin/bash
      changed_when: false

    # A previously rendered main.cf queues no handler, but an older master
    # process can still own sockets from its pre-hardening configuration.
    - name: Inspect Postfix runtime for stale TCP listeners
      shell: |
        set -o pipefail
        if ss -H -ltnp | \
          grep -Eq 'users:\(\("(master|smtpd|postscreen|smtp-sink)"'; then
          exit 0
        fi
        exit 1
      args:
        executable: /bin/bash
      register: postfix_runtime_listener_probe
      changed_when: false
      failed_when: postfix_runtime_listener_probe.rc not in [0, 1]

    - name: Restart Postfix to reconcile stale TCP listeners
      service:
        name: postfix
        state: restarted
      when: postfix_runtime_listener_probe.rc == 0

    - name: Verify Postfix exposes no TCP listening sockets
      shell: |
        set -o pipefail
        listeners="$(ss -H -ltnp)"
        if printf '%s\n' "$listeners" | \
          grep -Eq 'users:\(\("(master|smtpd|postscreen|smtp-sink)"'; then
          printf '%s\n' "$listeners" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # Direct delivery only passes DMARC through SPF when the real egress IP is
    # authorized for the aligned envelope sender.  The transport is hardened
    # before these fail-closed DNS gates run, so a DNS error cannot leave the
    # package's temporary installation-time listener behind.
    - name: Verify direct-alert envelope sender SPF authorization for this host
      command:
        argv:
          - /usr/bin/spfquery.mail-spf-perl
          - --scope
          - mfrom
          - --identity
          - "{{ alert_email_sender }}"
          - --ip-address
          - "{{ forwardemail_direct_alert_public_ip }}"
          - --helo-identity
          - "{{ forwardemail_direct_alert_helo_identity }}"
      register: direct_alert_spf_check
      changed_when: false
      failed_when: direct_alert_spf_check.rc != 0
      tags:
        - forwardemail-alert-spf

    # Receivers evaluate HELO SPF when the envelope sender is empty (for
    # example, delivery-status notifications), so the hostname needs its own
    # passing policy in addition to the aligned envelope-sender policy.
    - name: Verify direct-alert HELO SPF authorization for this host
      command:
        argv:
          - /usr/bin/spfquery.mail-spf-perl
          - --scope
          - helo
          - --identity
          - "{{ forwardemail_direct_alert_helo_identity }}"
          - --ip-address
          - "{{ forwardemail_direct_alert_public_ip }}"
      register: direct_alert_helo_spf_check
      changed_when: false
      failed_when: direct_alert_helo_spf_check.rc != 0
      tags:
        - forwardemail-alert-spf

    # Configure email for every alert and optional Twilio SMS exclusively for
    # systemd OnFailure notifications.
    - name: Install infrastructure alert sender dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - coreutils
          - curl
          - jq
          - util-linux
        state: present
        update_cache: true

    - name: Count configured Twilio environment variables
      ansible.builtin.set_fact:
        twilio_values_present: >-
          {{
            [
              twilio_account_sid,
              twilio_auth_token,
              twilio_from_number,
              twilio_to_number
            ]
            | reject('equalto', '')
            | list
            | length
          }}
      no_log: true

    - name: Validate Twilio SMS configuration
      ansible.builtin.assert:
        that:
          - (twilio_values_present | int) in [0, 4]
          - >-
            (twilio_values_present | int == 0) or
            (twilio_account_sid is match('^AC[0-9A-Fa-f]{32}$'))
          - >-
            (twilio_values_present | int == 0) or
            (twilio_auth_token is match('^[A-Za-z0-9]{32,64}$'))
          - >-
            (twilio_values_present | int == 0) or
            (twilio_from_number is match('^\\+[1-9][0-9]{7,14}$'))
          - >-
            (twilio_values_present | int == 0) or
            (twilio_to_number is match('^\\+[1-9][0-9]{7,14}$'))
        fail_msg: >-
          Set all four valid Twilio variables or leave all four unset:
          TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER,
          and TWILIO_TO_NUMBER.
      no_log: true

    - name: Validate systemd status incident configuration
      ansible.builtin.assert:
        that:
          - systemd_incident_failure_threshold | int >= 2
          - systemd_incident_failure_threshold | int <= 10
          - systemd_incident_recovery_threshold | int >= 2
          - systemd_incident_recovery_threshold | int <= 10
          - >-
            (github_octokit_token | length == 0) or
            (github_octokit_token is match('^[A-Za-z0-9_]{20,255}$'))
          - >-
            (forwardemail_systemd_incident_config | length == 0) or
            (forwardemail_systemd_incident_component is
            match('^(mongo|logs|redis)\\.forwardemail\\.net$'))
          - >-
            (forwardemail_systemd_incident_config | length == 0) or
            (forwardemail_systemd_incident_unit is
            match('^(mongod|valkey-server)\\.service$'))
        fail_msg: >-
          Invalid systemd incident configuration. Use a valid
          GITHUB_OCTOKIT_TOKEN and thresholds from 2 through 10; only the
          fixed MongoDB, Logs, and Valkey host/unit mappings are allowed.
      no_log: true
      tags:
        - forwardemail-systemd-incident

    - name: Report email-only alert mode
      ansible.builtin.debug:
        msg: >-
          Twilio variables are unset; routine alerts and systemd failures will
          continue by email only to {{ alert_email_recipients }}.
      when: twilio_values_present | int == 0

    - name: Report disabled public systemd incident mode
      ansible.builtin.debug:
        msg: >-
          Public systemd incident reporting is disabled for
          {{ forwardemail_systemd_incident_component }} because
          GITHUB_OCTOKIT_TOKEN is unset; private failure notifications remain
