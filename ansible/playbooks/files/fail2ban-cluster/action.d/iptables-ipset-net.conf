#
# iptables-ipset with a hash:net set, so ranges (an IPv4 /24, an IPv6 /64)
# can be banned as well as single addresses.

[INCLUDES]

before = iptables-ipset.conf

[Definition]

actionstart = ipset -exist create <ipmset> hash:net timeout <default-ipsettime> maxelem <maxelem> <familyopt>
              <_ipt_add_rules>

[Init]

maxelem = 1048576
