#
# Queues a ban for the other servers (see /usr/local/sbin/fail2ban-cluster).
# Only writes to a local file, so it never delays or fails the ban itself.

[Definition]

# bans restored when fail2ban starts were already published
norestored = 1

actionstart =
actionstop =
actioncheck =
actionban = <cluster_cmd> publish <ip>
actionunban =

[Init]

cluster_cmd = /usr/local/sbin/fail2ban-cluster
