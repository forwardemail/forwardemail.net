---
# ============================================================
# Play 1: Deploy certificates to app servers
# ============================================================
- hosts: imap:pop3:smtp:http:bree:sqlite:mx1:mx2
  name: Certificates (app servers)
  vars_prompt:
    - name: input_key
      prompt: 'Enter path to certificate private key file (e.g. /path/to/.ssl-key) [REQUIRED]'
      private: false
    - name: input_cert
      prompt: 'Enter path to certificate full chain/certificate file (e.g. /path/to/.ssl-cert) [REQUIRED]'
      private: false
    - name: input_bundle
      prompt: 'Enter path to certificate CA bundle file (e.g. /path/to/.ssl-ca) [REQUIRED]'
      private: false
    - name: input_apple_key
      prompt: 'Optional: Leave blank or enter path to Apple services .p8 key file (e.g. /path/to/AuthKey_00000000000.p8)'
      private: false
    - name: input_firebase_service_account
      prompt: 'Optional: Leave blank or enter path to Firebase service-account JSON file (e.g. /path/to/firebase-service-account.json)'
      private: false

  tasks:
    # Validate required inputs
    - name: Fail if key path is empty
      fail:
        msg: 'Certificate private key path is required. Please re-run the playbook and provide a valid path.'
      when: (input_key is not defined) or (input_key | length == 0)

    - name: Fail if cert path is empty
      fail:
        msg: 'Certificate file path is required. Please re-run the playbook and provide a valid path.'
      when: (input_cert is not defined) or (input_cert | length == 0)

    - name: Fail if bundle path is empty
      fail:
        msg: 'CA bundle file path is required. Please re-run the playbook and provide a valid path.'
      when: (input_bundle is not defined) or (input_bundle | length == 0)

    # key file
    - name: Check if key file exists
      local_action: stat path={{ input_key }}
      become: false
      register: local_key_file
    - name: Fail when local key file does not exist
      fail:
        msg: 'key file does not exist: {{ input_key }}'
      when: not local_key_file.stat.exists

    # cert file
    - name: Check if cert file exists
      local_action: stat path={{ input_cert }}
      become: false
      register: local_cert_file

    - name: Fail when local cert file does not exist
      fail:
        msg: 'cert file does not exist: {{ input_cert }}'
      when: not local_cert_file.stat.exists

    # bundle file
    - name: Check if bundle file exists
      local_action: stat path={{ input_bundle }}
      register: local_bundle_file
      become: false

    - name: Fail when local bundle file does not exist
      fail:
        msg: 'bundle file does not exist: {{ input_bundle }}'
      when: not local_bundle_file.stat.exists

    # apple_key file
    - name: Check if apple_key file exists
      local_action: stat path={{ input_apple_key }}
      register: local_apple_key_file
      become: false
      when: (input_apple_key is defined) and (input_apple_key | length > 0)

    - name: Fail when local apple_key file does not exist
      fail:
        msg: 'Apple services key file does not exist: {{ input_apple_key }}'
      when: (input_apple_key is defined) and (input_apple_key | length > 0) and (not local_apple_key_file.stat.exists)

    # firebase_service_account file
    - name: Check if firebase_service_account file exists
      local_action: stat path={{ input_firebase_service_account }}
      register: local_firebase_service_account_file
      become: false
      when: (input_firebase_service_account is defined) and (input_firebase_service_account | length > 0)

    - name: Fail when local firebase_service_account file does not exist
      fail:
        msg: 'Firebase service-account JSON file does not exist: {{ input_firebase_service_account }}'
      when: (input_firebase_service_account is defined) and (input_firebase_service_account | length > 0) and (not local_firebase_service_account_file.stat.exists)

    # remote dir
    - name: Check if remote dir exists
      stat:
        path: /var/www/production
      register: remote_dir

    - name: Fail when remote dir does not exist
      fail:
        msg: pm2 dir not yet created
      when: not remote_dir.stat.exists or not remote_dir.stat.isdir

    # copy local key
    - name: Copy local key file to server
      copy:
        src: '{{ input_key }}'
        dest: /var/www/production/.ssl-key
        owner: deploy
        # https://chmodcommand.com/chmod-660/
        mode: '0660'

    # copy local cert
    - name: Copy local cert file to server
      copy:
        src: '{{ input_cert }}'
        dest: /var/www/production/.ssl-cert
        owner: deploy
        # https://chmodcommand.com/chmod-660/
        mode: '0660'

    # copy local bundle
    - name: Copy local bundle file to server
      copy:
        src: '{{ input_bundle }}'
        dest: /var/www/production/.ssl-ca
        owner: deploy
        # https://chmodcommand.com/chmod-660/
        mode: '0660'

    # copy local apple_key
    - name: Copy local apple_key file to server
      copy:
        src: '{{ input_apple_key }}'
        dest: '/var/www/production/{{ input_apple_key | basename }}'
        owner: deploy
        # https://chmodcommand.com/chmod-660/
        mode: '0660'
      when: (input_apple_key is defined) and (input_apple_key | length > 0)

    # copy local firebase_service_account
    - name: Copy local firebase_service_account file to server
      copy:
        src: '{{ input_firebase_service_account }}'
        dest: /var/www/production/firebase-service-account.json
        owner: deploy
        # https://chmodcommand.com/chmod-660/
        mode: '0660'
      when: (input_firebase_service_account is defined) and (input_firebase_service_account | length > 0)

# ============================================================
# Play 2: Deploy certificates to MongoDB servers
# ============================================================
- hosts: mongo
  name: Certificates (MongoDB)
  become: true
  become_user: root
  vars_prompt:
    - name: input_key
      prompt: 'Enter path to certificate private key file (e.g. /path/to/.ssl-key) [REQUIRED]'
      private: false
    - name: input_cert
      prompt: 'Enter path to certificate full chain/certificate file (e.g. /path/to/.ssl-cert) [REQUIRED]'
      private: false
    - name: input_bundle
      prompt: 'Enter path to certificate CA bundle file (e.g. /path/to/.ssl-ca) [REQUIRED]'
      private: false

  tasks:
    - name: Create /etc/mongodb/ssl directory
      file:
        path: /etc/mongodb/ssl
        state: directory
        owner: mongodb
        group: mongodb
        mode: "0750"

    - name: Copy SSL certificate to MongoDB directory
      copy:
        src: "{{ input_cert }}"
        dest: /etc/mongodb/ssl/mongodb.crt
        owner: mongodb
        group: mongodb
        mode: "0400"

    - name: Copy SSL private key to MongoDB directory
      copy:
        src: "{{ input_key }}"
        dest: /etc/mongodb/ssl/mongodb.key
        owner: mongodb
        group: mongodb
        mode: "0400"

    - name: Copy CA certificate to MongoDB directory
      copy:
        src: "{{ input_bundle }}"
        dest: /etc/mongodb/ssl/ca.pem
        owner: mongodb
        group: mongodb
        mode: "0400"

    - name: Create MongoDB TLS/SSL certificate PEM file (cert + key)
      shell: |
        cat /etc/mongodb/ssl/mongodb.crt /etc/mongodb/ssl/mongodb.key > /etc/mongodb/ssl/mongodb.pem
        chown mongodb:mongodb /etc/mongodb/ssl/mongodb.pem
        chmod 0400 /etc/mongodb/ssl/mongodb.pem

    - name: Restart MongoDB
      systemd:
        name: mongod
        state: restarted

