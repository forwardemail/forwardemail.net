---
# Destructive cleanup for explicitly decommissioned, unmanaged hosts only.
# Active hosts managed by security.yml require the send-only alert transport.

- name: Remove Postfix from explicitly decommissioned hosts
  hosts: "{{ target_hosts }}"
  become: true
  become_user: root
  pre_tasks:
    - name: Require explicit Postfix removal acknowledgement
      assert:
        that:
          - confirm_remove_postfix | default(false) | bool
          - target_hosts | default('') | trim | length > 0
          - target_hosts | trim != 'all'
        fail_msg: >-
          Refusing to remove the independent alert transport. Limit this
          playbook to an explicit decommissioned host and set
          confirm_remove_postfix=true.
  tasks:
    - name: Stop Postfix service
      systemd:
        name: postfix
        state: stopped
        enabled: false
      failed_when: false
      register: postfix_stop

    - name: Remove Postfix package
      apt:
        name:
          - postfix
          - postfix-pcre
        state: absent
        purge: true
        autoremove: true

    - name: Remove Postfix configuration directory
      file:
        path: /etc/postfix
        state: absent

    - name: Remove Postfix spool directory
      file:
        path: /var/spool/postfix
        state: absent

    - name: Remove Postfix mail queue
      file:
        path: /var/mail
        state: absent
      when: false  # Keep /var/mail as it might be used by other services

    - name: Display removal status
      debug:
        msg: >-
          Postfix was removed from decommissioned host {{ inventory_hostname }}.
          The host no longer has the independent infrastructure alert transport.
