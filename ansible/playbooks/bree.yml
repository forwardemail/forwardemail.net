---
- name: Hostname
  hosts: bree
  gather_facts: false
  become: true
  become_user: root
  tags:
    - always
    - forwardemail-alert-hostname
  tasks:
    - name: Validate Bree hostname
      ansible.builtin.assert:
        that:
          - lookup('env', 'BREE_HOST') != ''
        fail_msg: BREE_HOST must be set before configuring alerts.

    - name: Set hostname before security identity discovery
      ansible.builtin.hostname:
        name: "{{ lookup('env', 'BREE_HOST') }}"

    - name: Set Bree alert hostname
      ansible.builtin.set_fact:
        forwardemail_entrypoint_expected_hostname: >-
          {{ lookup('env', 'BREE_HOST') }}

- name: Import security playbook
  import_playbook: security.yml
  vars:
    security_target_hosts: "bree"
    security_expected_alert_hostname: >-
      {{ forwardemail_entrypoint_expected_hostname }}
    security_sms_services:
      - pm2-deploy.service
      - pm2-health-check.service
- name: Import Node.js playbook
  import_playbook: node.yml
  vars:
    node_target_hosts: "bree"
- name: Import SSH keys playbook
  import_playbook: ssh-keys.yml
  vars:
    ssh_keys_target_hosts: "bree"
- hosts: bree
  name: Bree
  become: true
  become_user: root
  tasks:
    # ufw
    - name: Enable ufw
      ufw:
        state: enabled
        policy: deny
        direction: incoming
    - name: Set UFW default forward policy to DROP
      lineinfile:
        dest: /etc/default/ufw
        line: DEFAULT_FORWARD_POLICY="DROP"
        regexp: ^DEFAULT_FORWARD_POLICY\=
    - name: Limit ufw ssh
      ufw:
        rule: limit
        port: 22
        proto: tcp
    - name: Allow ssh
      ufw:
        rule: allow
        port: 22
        proto: tcp
    - name: Reload ufw
      ufw:
        state: reloaded
